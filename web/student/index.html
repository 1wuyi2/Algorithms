<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>南开大学学院级智能排课系统 - 学生端</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">NK</div>
          <div>
            <h1>学生端智能推荐系统</h1>
          </div>
          <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="收起导航" aria-expanded="true">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
        <nav class="nav-tabs" aria-label="学生端模块">
          <a class="nav-tab active" href="#profile">个人首页</a>
          <a class="nav-tab" href="#settings">推荐设置</a>
          <a class="nav-tab" href="#schedule">当前课表</a>
          <a class="nav-tab" href="#recommendations">推荐结果</a>
        </nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Student Portal</p>
            <h2>学生端智能推荐系统</h2>
          </div>
          <div class="topbar-actions">
            <span id="studentIdentity" class="identity-label">未登录</span>
            <button id="logoutButton" class="ghost-button" type="button">退出</button>
          </div>
        </header>

        <section class="metric-grid" aria-label="学习状态摘要">
          <div class="metric">
            <span>1</span>
            <small>已修课程</small>
          </div>
          <div class="metric">
            <span>2</span>
            <small>当前课表</small>
          </div>
          <div class="metric">
            <span id="recommendLimit">4</span>
            <small>推荐上限</small>
          </div>
        </section>

        <section class="view active">
          <div id="profile"></div>

          <section class="panel student-summary" aria-labelledby="studentName">
            <div class="panel-title">
              <h4>个人信息</h4>
            </div>
            <div class="profile-block">
              <span id="studentName" hidden>学生用户</span>
              <dl class="detail-list profile-list">
                <div>
                  <dt>学号</dt>
                  <dd id="studentId">2611222</dd>
                </div>
                <div>
                  <dt>专业</dt>
                  <dd>计算机科学与技术</dd>
                </div>
                <div>
                  <dt>年级</dt>
                  <dd>2023</dd>
                </div>
              </dl>
            </div>
          </section>

          <div class="student-grid">
            <section class="panel settings-panel" id="settings">
              <div class="panel-title">
                <h4>推荐设置</h4>
                <button id="recommendButton" class="primary-button" type="button">生成推荐</button>
              </div>
              <form id="recommendForm" class="settings-form">
                <label>
                  兴趣方向
                  <input name="interests" value="algorithm, AI" autocomplete="off" />
                </label>
                <label>
                  推荐数量
                  <input name="topK" type="number" min="1" max="10" value="4" />
                </label>
                <label class="checkbox-row">
                  <input name="includeConflicted" type="checkbox" checked />
                  保留时间冲突课程
                </label>
              </form>
              <p id="recommendStatus" class="result-strip">
                可以直接用示例数据生成推荐；后端启动后会优先调用接口。
              </p>
            </section>

            <section class="panel schedule-panel" id="schedule">
              <div class="panel-title">
                <h4>当前课表</h4>
                <span>本周课程</span>
              </div>
              <div id="scheduleList" class="schedule-list"></div>
            </section>

            <section class="panel recommendations-panel" id="recommendations">
              <div class="panel-title">
                <h4>推荐结果</h4>
                <span id="recommendationCount" class="badge neutral">0 门</span>
              </div>
              <div id="recommendationList" class="recommendation-list">
                <div class="empty-state">点击“生成推荐”查看课程列表</div>
              </div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
