<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>南开大学学院级智能排课系统 - 学生端</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>学生端</h1>
        </div>
        <div class="user-actions">
          <span id="studentIdentity">未登录</span>
          <button id="logoutButton" type="button">退出</button>
        </div>
      </header>

      <main class="layout">
        <section class="panel profile-card">
          <div>
            <p class="section-label">个人信息</p>
            <h2 id="studentName">学生用户</h2>
            <dl>
              <div><dt>学号</dt><dd id="studentId">2611222</dd></div>
              <div><dt>专业</dt><dd>计算机科学与技术</dd></div>
              <div><dt>年级</dt><dd>2023</dd></div>
            </dl>
          </div>
        </section>

        <section class="panel settings-card">
          <div class="panel-title">
            <div>
              <p class="section-label">推荐设置</p>
              <h2>课程推荐</h2>
            </div>
            <button id="recommendButton" type="button">生成推荐</button>
          </div>
          <form id="recommendForm" class="settings-form">
            <label>
              兴趣方向
              <input name="interests" value="algorithm, AI" />
            </label>
            <label>
              推荐数量
              <input name="topK" type="number" min="1" max="10" value="4" />
            </label>
            <label class="checkbox-row">
              <input name="includeConflicted" type="checkbox" checked />
              显示时间冲突课程
            </label>
          </form>
          <p id="recommendStatus" class="status-text">可直接使用示例数据生成推荐；后端启动后会优先调用接口。</p>
        </section>

        <section class="panel schedule-card">
          <div class="panel-title">
            <div>
              <p class="section-label">当前课表</p>
              <h2>本周课程</h2>
            </div>
          </div>
          <div id="scheduleList" class="schedule-list"></div>
        </section>

        <section class="panel recommendations-card">
          <div class="panel-title">
            <div>
              <p class="section-label">推荐结果</p>
              <h2>适合你的课程</h2>
            </div>
            <span id="recommendationCount" class="count-badge">0 门</span>
          </div>
          <div id="recommendationList" class="recommendation-list">
            <div class="empty-state">点击“生成推荐”查看课程列表</div>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
